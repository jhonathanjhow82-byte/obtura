<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel dos Embaixadores · Obtura</title>
<link rel="icon" href="/img/icon.png">
<style>
:root{--bg:#0A0A0C;--panel:#141418;--line:rgba(255,255,255,.1);--fg:#F4F3F7;--dim:#A9A8B6;--grad:linear-gradient(90deg,#6E28DC,#EB3C8C 40%,#FF823C 75%,#FFCD5A)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;padding:32px max(16px,env(safe-area-inset-left))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-size:30px;letter-spacing:-.02em}h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.dim{color:var(--dim)}form{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:220px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit}
button{padding:12px 20px;border:0;border-radius:999px;background:var(--grad);color:#fff;font:600 15px inherit;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.kpi span{font-size:13px;color:var(--dim)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
td small{display:block;color:var(--dim);font-size:12px}.err{color:#FF6B6B}
</style></head><body><div class="wrap">
<h1>Painel dos <span>Embaixadores</span></h1>
<p class="dim">Cliques, downloads e assinaturas que cada embaixador trouxe pelo link (obturaapp.com.br/nome) e pelo cupom. A senha fica só neste navegador enquanto a aba estiver aberta.</p>
<form id="f"><input id="k" type="password" placeholder="Senha do painel (STATS_KEY)" autocomplete="current-password"><button>Ver números</button></form>
<p id="msg" class="dim"></p>
<div id="out" hidden>
<div class="kpis" id="kpis"></div>
<div class="tbl"><table><thead><tr><th>Embaixador</th><th>Visitas</th><th>Do celular</th><th>Links enviados</th><th>Downloads Mac</th><th>Downloads Win</th><th>Contas</th><th>Assinaturas</th><th>Receita</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></div>
<script>
const URL_STATS='https://oqclsemdwzpsdyjbfxyh.supabase.co/functions/v1/ref-stats';
const $=s=>document.querySelector(s), brl=v=>'R$ '+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(key){
  $('#msg').className='dim'; $('#msg').textContent='Carregando…';
  try{ const r=await fetch(URL_STATS,{headers:{'x-stats-key':key}});
    if(r.status===401){ $('#msg').className='err'; $('#msg').textContent='Senha errada. Confira o STATS_KEY no Supabase.'; return; }
    if(!r.ok) throw new Error('O servidor respondeu '+r.status);
    const d=await r.json(), t=d.totals||{};
    try{ sessionStorage.setItem('obtura_stats_key',key) }catch(e){}
    $('#kpis').innerHTML=[['Visitas',t.visits],['Links enviados do celular',t.linkCelular],['Downloads',(t.downloads?.mac||0)+(t.downloads?.windows||0)],['Contas com cupom',t.accounts],['Assinaturas pagas',t.paidSubscriptions],['Receita',brl(t.revenue)]]
      .map(([l,v])=>`<div class="kpi"><b>${esc(v??0)}</b><span>${l}</span></div>`).join('');
    $('#rows').innerHTML=(d.ambassadors||[]).sort((a,b)=>(b.visits||0)-(a.visits||0)).map(a=>`<tr>
      <td>${esc(a.name)}<small>@${esc(a.instagram)} · cupom ${esc(a.coupon)} · obturaapp.com.br/${esc((a.code||'').toLowerCase())}</small></td>
      <td>${a.visits||0}</td><td>${a.visitsMobile||0}</td><td>${a.linkCelular||0}</td><td>${a.downloads?.mac||0}</td><td>${a.downloads?.windows||0}</td>
      <td>${a.accounts||0}</td><td>${a.paidSubscriptions||0}</td><td>${brl(a.revenue)}</td></tr>`).join('');
    $('#out').hidden=false;
    $('#msg').textContent='Atualizado em '+new Date(d.generatedAt||Date.now()).toLocaleString('pt-BR');
  }catch(e){ $('#msg').className='err'; $('#msg').textContent='Não consegui carregar: '+e.message; }
}
$('#f').addEventListener('submit',e=>{e.preventDefault(); const k=$('#k').value.trim(); if(k) load(k);});
try{ const k=sessionStorage.getItem('obtura_stats_key'); if(k){ $('#k').value=k; load(k);} }catch(e){}
</script></body></html>
